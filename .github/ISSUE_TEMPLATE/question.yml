name: Question
description: Ask for help when the documentation does not answer your question.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Ask a specific question and describe what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant docs, code, commands, or errors.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include cpi version and platform details when relevant.
