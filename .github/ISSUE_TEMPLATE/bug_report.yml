name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug. Do not report security
        vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the smallest reliable example and exact steps.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include cpi version, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, tracebacks, or other useful details.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
