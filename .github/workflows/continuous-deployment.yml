name: Continuous deployment

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: make install-dev

      - name: Run static checks
        run: make check

      - name: Prune uv cache
        run: uv cache prune --ci

  test-python:
    name: Test Python code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Python dependencies
        run: make install-test UV_PYTHON=${{ matrix.python }}

      - name: Initialize CPI database
        run: uv run --python ${{ matrix.python }} python -c 'import cpi'

      - name: Run tests
        run: make test UV_PYTHON=${{ matrix.python }}

      - name: Verify data can update
        run: uv run --python ${{ matrix.python }} python -c 'import cpi; cpi.update()'

      - name: Prune uv cache
        run: uv cache prune --ci

  test-conda:
    name: Test Conda on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Conda environment
        run: |
          "$CONDA/bin/conda" create -y -n cpi "python=${{ matrix.python }}"
          "$CONDA/bin/conda" install -y -n cpi requests click python-dateutil pandas pytest pytest-cov pytest-xdist

      - name: Initialize CPI database
        run: |
          "$CONDA/bin/conda" run -n cpi python -c "import cpi"

      - name: Run tests
        run: |
          "$CONDA/bin/conda" run -n cpi pytest -n auto --cov=cpi --cov-report term-missing tests

      - name: Verify data can update
        run: |
          "$CONDA/bin/conda" run -n cpi python -c "import cpi; cpi.update()"

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [check, test-python, test-conda]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Initialize CPI database
        run: uv run --no-env-file python -c 'import cpi'

      - name: Build distributions
        run: make build

      - name: Save artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error

      - name: Prune uv cache
        run: uv cache prune --ci

  tag-release:
    name: Tagged PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
    steps:
      - name: Fetch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: ./dist

      - name: Publish release
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
          verify-metadata: false
